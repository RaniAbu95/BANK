services:
  - type: web
    name: bank-server
    runtime: docker
    plan: free
    # קרוב למסד ב-Aiven (DigitalOcean, אמסטרדם)
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SECURITY_LOG_LEVEL
        value: INFO
      - key: SHOW_SQL
        value: "false"
