spring.application.name=myFirstDBProject
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Bank}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:9876543210}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=${PORT:8081}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.open-in-view=true



spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# כשמוגדר מפתח, המיילים נשלחים דרך Resend במקום SMTP
bank.resend.api-key=${RESEND_API_KEY:}
bank.resend.from=${RESEND_FROM:}
bank.admin.password=${ADMIN_PASSWORD:}
# בנקאי שנוצר בהפעלה כשאין אף בנקאי במסד
bank.default-banker.name=${DEFAULT_BANKER_NAME:Default Banker}
bank.default-banker.email=${DEFAULT_BANKER_EMAIL:banker@bank.local}
bank.jwt.secret=${JWT_SECRET:your_secret_key}
# כתובות לקוח מופרדות בפסיקים שמורשות לפנות לשרת מדומיין אחר (למשל האתר ב-Cloudflare Pages)
bank.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Client ID של אפליקציית OAuth ב-Google Cloud. ריק = התחברות עם Google כבויה
bank.google.client-id=${GOOGLE_CLIENT_ID:}
